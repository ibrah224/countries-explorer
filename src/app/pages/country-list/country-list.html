<header class="top">
    <h1>🌍 Countries Explorer</h1>
    <div class="filters">
      <input
        type="search"
        placeholder="Rechercher un pays ou une capitale…"
        [value]="search()"
        (input)="search.set($any($event.target).value)"
      />
      <select [value]="region()" (change)="region.set($any($event.target).value)">
        <option value="">Toutes les régions</option>
        @for (r of regions(); track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </div>
    <p class="count">{{ filtered().length }} pays</p>
  </header>
  
  <main class="grid">
    @for (c of filtered(); track c.codes.alpha_3) {
      <a class="card" [routerLink]="['/country', c.codes.alpha_3]">
        <img [src]="c.flag.url_svg" [alt]="c.flag.description || c.names.common" loading="lazy" />
        <div class="info">
          <h2>{{ c.names.common }}</h2>
          <p>{{ c.capitals?.[0]?.name || '—' }}</p>
          <p class="muted">{{ c.population | number }} hab. · {{ c.region }}</p>
        </div>
      </a>
    } @empty {
      <p class="muted">Aucun résultat.</p>
    }
  </main>
